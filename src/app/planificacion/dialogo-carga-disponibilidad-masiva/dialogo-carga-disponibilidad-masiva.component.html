<h2 style="font-family: regular;color:#75518c" mat-dialog-title>New Schedule Time From File</h2>

<mat-dialog-content>
  <div>
    <label for='fileId' [class]='file.length == 0 ?"fake-button accent":"fake-button"' tabindex="0">
      @if (file.length == 0) {
        <span>Select File</span>
      }
      @if (file.length > 0) {
        <span>File Selected</span>
      }
    </label>

    @if (file.length == 0) {
      <label style="display: inline-block; line-height: 32px; font-size: 13px; color:rgba(0,0,0,0.5);font-family: regular;"
      >No file selected</label>
    }
    @for (f of file; track f) {
      <label style="display: inline-block; line-height: 32px; font-size: 13px; color:rgba(0,0,0,0.5);font-family: regular;"
      >{{f.name}}</label>
    }

    <input id='fileId' type="file" #fileInput (change)="onFileSelected(fileInput.files)" accept=".xls, .xlsx"
      style='display:none;'>
  </div>
</mat-dialog-content>

<mat-dialog-actions>
  <button class="iigwo" style="margin-left:auto;" (click)='cerrar()'>Cancel</button>
  <button class="iigwo accent" style="margin-right:0;" (click)='enviar()'>Send</button>
</mat-dialog-actions>

<!-- CARGANDO-->
@if (cargando) {
  <div class='iigwo-loading'>
    <mat-spinner></mat-spinner>
  </div>
}
