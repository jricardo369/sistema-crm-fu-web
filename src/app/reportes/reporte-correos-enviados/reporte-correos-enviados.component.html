
<app-workspace-nav>
  <app-reportes-nav></app-reportes-nav>
</app-workspace-nav>
<div class='workspace'>
  <div class='main'>

    <app-experimental-menu titulo="Law Firm Files">

      <button (click)='obtenerCorreosEnviados()' class="btn"
        style="color: #FFFFFF;background: #f3c956; border-radius: 5px; height: 20px; line-height: 20px;">
        <mat-icon svgIcon="refresh"
          style="color:rgba(255, 255, 255, 0.7); width: 15px; height: 15px;margin-bottom: 0px;margin-right: 5px;"></mat-icon>
        <label style="margin: auto;color: #FFFFFF;text-transform: none;">Refresh</label>
      </button>

      <button (click)='descargarExcel()' class="btn"
        style="color: #000000;background: #e5e5e5; border-radius: 5px; height: 20px; line-height: 20px;">
        <mat-icon svgIcon="exportD"
          style="color:rgba(0, 0, 0, 0.7); width: 15px; height: 15px;margin-bottom: 2px;margin-right: 5px;"></mat-icon>
        <label style="margin: auto;color: #000000;text-transform: none;">Export Data</label>
      </button>

    </app-experimental-menu>

    <div class='content'>
      <div style="display: inline-flex;">
        <div style="display: inline-flex;">

          <div class="iigwo-input">
            <label>Start Date</label>
            <mat-form-field appearance="outline" class="custom-datepicker">
              <input matInput [matDatepicker]="startPicker" [(ngModel)]="filterStartDateMat"
                (dateChange)="onStartDateChange()">
              <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
              <mat-datepicker #startPicker></mat-datepicker>
            </mat-form-field>
          </div>

          <div class="iigwo-input">
            <label>End Date</label>
            <mat-form-field appearance="outline" class="custom-datepicker">
              <input matInput [matDatepicker]="endPicker" [(ngModel)]="filterEndDateMat"
                (dateChange)="onEndDateChange()">
              <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
              <mat-datepicker #endPicker></mat-datepicker>
            </mat-form-field>
          </div>

          <!--<button class="iigwo" style="margin-top: 12px" (click)='limpiarFechas()'>Clear dates</button>-->

          <button (click)='limpiarFechas()' class="btn-color"
            style="color: #000000; background: #ffffff;border: 0.5px solid #b1b1b1;margin-top: 18px;">
            <!--<mat-icon svgIcon="exportD" style="color: rgba(0, 0, 0, 0.7); width: 14px;  vertical-align: middle;"></mat-icon>-->
            <span style="color: #000000; font-size: 13px;">Clear dates</span>
          </button>

        </div>
      </div>
    </div>

    <div class='content' style="margin-top: 80px;padding-top: 0;">

      <table class="informative">
        <tr>
          <th>Law Firm</th>
          <th>Lawyer name</th>
          <th>Emails lawyer</th>
          <th>Number of files</th>
          <!--<th>Detalis</th>-->
        </tr>
        <ng-container *ngFor="let e of arrReporteCorreosEnviados | slice:paginacion.begin:paginacion.end; let i = index">
          <tr (click)="expandedRow === i ? expandedRow = null : expandedRow = i" style="cursor:pointer;">
            <td class='accent'>{{e.firma}}</td>
            <td class='accent' [ngStyle]="{'color': e.nombre === 'Without asociated lawyer' ? 'dodgerblue' : 'inherit'}">
              {{e.nombre}}</td>
            <td class='accent'>{{e.emails}}</td>
            <td (click)="$event.stopPropagation(); verSolicitudesLawyer(e.nombre,e.idAbogado,e.firma)" style="text-align: center;">
              <span class="badge-status" style="margin: 0;cursor: pointer;"
                [ngClass]="{'badge-color-0': e.numero == 0, 'badge-color-1': e.numero >= 1}">{{e.numero}}</span>
            </td>
            <!--<td>
              <button (click)="$event.stopPropagation(); expandedRow === i ? expandedRow = null : expandedRow = i">{{expandedRow === i ? 'Ocultar' : 'Ver más'}}</button>
            </td>-->
          </tr>
          <!--<tr *ngIf="expandedRow === i">
            <td colspan="5" style="background: #f9f9f9; border-top: 1px solid #eee;">
              <div style="padding: 10px;">
              <strong>Detalle del registro:</strong>
              <table *ngIf="e.detalle && e.detalle.length" style="width:100%; margin-top:10px;" border="1">
                <tr>
                  <th>Campo 1</th>
                  <th>Campo 2</th>
                </tr>
                <tr *ngFor="let d of e.detalle">
                  <td>{{d.campo1}}</td>
                  <td>{{d.campo2}}</td>
                </tr>
              </table>
              <div *ngIf="!e.detalle || !e.detalle.length">Sin detalles</div>
            </div>
            </td>
          </tr>-->
        </ng-container>
        <tr>
          <td colspan="99" style="text-align: right;line-height: 24px;" class="mini">
            <label>
              Records per page</label>
            <select [(ngModel)]="paginacion.size" (ngModelChange)="paginacion.fix()"
              [ngModelOptions]="{standalone: true}" style="margin: 0 8px; font-family: regular; height: 24px;">
              <option value="15">15</option>
              <option value="30">30</option>
              <option value="45">45</option>
              <option value="100">100</option>
            </select>
            {{paginacion.begin + 1}}-{{paginacion.end}} of {{paginacion.array.length}}
            <button class="iigwo small" style="margin: 0 0 0 8px; padding:0; height: 24px; min-height: 24px;"
              (click)="paginacion.back();">
              <mat-icon svgIcon="arrow-back"></mat-icon>
            </button>
            <button class="iigwo small" style="margin: 0 0 0 8px; padding:0; height: 24px; min-height: 24px;"
              (click)="paginacion.forward();">
              <mat-icon svgIcon="arrow-forward"></mat-icon>
            </button>
          </td>
        </tr>


      </table>

    </div>

    <!--Cargando-->
    <div class='iigwo-loading' *ngIf="cargando">
      <mat-spinner></mat-spinner>
    </div>
  </div>
</div>
