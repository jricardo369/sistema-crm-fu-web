<app-workspace-nav>
  <app-reportes-nav></app-reportes-nav>
</app-workspace-nav>
<div class='workspace'>
  <div class='main'>
    <app-experimental-menu titulo="Lawyer tracking reports">
      <button class="btn" style="color: #FFFFFF;background: #f3c956; border-radius: 5px; height: 20px; line-height: 20px;">
        <mat-icon svgIcon="refresh" style="color:rgba(255, 255, 255, 0.7); width: 15px; height: 15px;margin-bottom: 0px;margin-right: 5px;"></mat-icon>
        <label style="margin: auto;color: #FFFFFF;text-transform: none;">Refresh</label>
      </button>
      <!--<button class="btn" style="color: #000000;background: #e5e5e5; border-radius: 5px; height: 20px; line-height: 20px;">
      <mat-icon svgIcon="exportD" style="color:rgba(0, 0, 0, 0.7); width: 15px; height: 15px;margin-bottom: 2px;margin-right: 5px;"></mat-icon>
      <label style="margin: auto;color: #000000;text-transform: none;">Export Data</label>
    </button>-->
  </app-experimental-menu>

  <div class='content'>
    <div style="display: inline-flex;">
      <div style="display: inline-flex;">

        <div class="iigwo-input">
          <label>Start Date</label>
          <mat-form-field appearance="outline" class="custom-datepicker">
            <input matInput [matDatepicker]="startPicker" [(ngModel)]="filterStartDateMat"
              (dateChange)="onStartDateChange()">
            <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
            <mat-datepicker #startPicker></mat-datepicker>
          </mat-form-field>
        </div>

        <div class="iigwo-input">
          <label>End Date</label>
          <mat-form-field appearance="outline" class="custom-datepicker">
            <input matInput [matDatepicker]="endPicker" [(ngModel)]="filterEndDateMat"
              (dateChange)="onEndDateChange()">
            <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
            <mat-datepicker #endPicker></mat-datepicker>
          </mat-form-field>
        </div>

        <!--<button class="iigwo" style="margin-top: 12px" (click)='limpiarFechas()'>Clear dates</button>-->

        <button (click)='limpiarFechas()' class="btn-color"
          style="color: #000000; background: #ffffff;border: 0.5px solid #b1b1b1;margin-top: 18px;">
          <!--<mat-icon svgIcon="exportD" style="color: rgba(0, 0, 0, 0.7); width: 14px;  vertical-align: middle;"></mat-icon>-->
          <span style="color: #000000; font-size: 13px;">Clear dates</span>
        </button>

      </div>
    </div>
  </div>


  <div id='reportes-content' class='content' style="margin-top: 80px;padding-top: 0;">


    <mat-tab-group>
      <mat-tab label="Lawyers by Estate" >
        <div style="padding: 16px;">
          <!--<h3>Lawyers by Estate</h3>-->
          <div class="chart-card full-width" >
            <apx-chart
              [series]="chartOptions.series"
              [chart]="chartOptions.chart"
              [xaxis]="chartOptions.xaxis"
              [yaxis]="chartOptions.yaxis"
              [dataLabels]="chartOptions.dataLabels"
              [title]="chartOptions.title"
              [colors]="chartOptions.colors"
              style="max-width: 100%; margin: 0 auto;"
            ></apx-chart>
          </div>
        </div>
      </mat-tab>
      <mat-tab label="Law Office Performance Analysis">
        <div style="padding: 16px;">
          <div class="chart-card full-width">
            <apx-chart
              [series]="chartOptionsFirma.series"
              [chart]="chartOptionsFirma.chart"
              [xaxis]="chartOptionsFirma.xaxis"
              [yaxis]="chartOptionsFirma.yaxis"
              [dataLabels]="chartOptionsFirma.dataLabels"
              [title]="chartOptionsFirma.title"
              [colors]="chartOptionsFirma.colors"
              [plotOptions]="chartOptionsFirma.plotOptions"
              style="max-width: 100%; margin: 0 auto;"
            ></apx-chart>
          </div>
        </div>
      </mat-tab>
      <mat-tab label="New Lawyers Analysis">
        <div style="padding: 16px;">
          <div class="chart-card full-width">
            <apx-chart
              [series]="chartOptionsFirmasPorMes.series"
              [chart]="chartOptionsFirmasPorMes.chart"
              [xaxis]="chartOptionsFirmasPorMes.xaxis"
              [yaxis]="chartOptionsFirmasPorMes.yaxis"
              [dataLabels]="chartOptionsFirmasPorMes.dataLabels"
              [title]="chartOptionsFirmasPorMes.title"
              style="max-width: 100%; margin: 0 auto;"
            ></apx-chart>
          </div>
        </div>
      </mat-tab>
    </mat-tab-group>

  </div>


  @if (cargando) {
    <div class='iigwo-loading'>
      <mat-spinner></mat-spinner>
    </div>
  }
</div>

</div>
