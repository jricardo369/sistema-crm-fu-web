<h2 mat-dialog-title style="font-family: regular;color:#75518c">{{titulo}}</h2>

<mat-dialog-content style="width:300px;min-width: 200px;">

  <div style="margin-bottom: 10px;">
    <label  style="font-size:12px;font-family: regular;">{{subtitulo}}</label>
  </div>

  <div class="iigwo-input" style="width: 150px;">
    <label>{{textoSesiones}}</label>
    <input type="number" [(ngModel)]="numSesiones" min="0" minlength="1">
  </div>

  <div class="iigwo-input" style="margin-bottom: 15px;" >
    <label required>{{textoRazon}}</label>
    <textarea [(ngModel)]="cancelReason"
    style="width: 100% !important;min-width: 100%;max-width: 100%;min-height: 55px;"></textarea>
  </div>

</mat-dialog-content>

<mat-dialog-actions>
  <button class="iigwo" style="margin-left:auto;"  (click)='cerrar()'>Cancel</button>
  <button class="iigwo accent" style="margin-right:0;"  (click)='envioApprovedSessionsAdjustment()'>Send</button>
</mat-dialog-actions>

<!-- CARGANDO-->
@if (cargando) {
  <div class='iigwo-loading'>
    <mat-spinner></mat-spinner>
  </div>
}
