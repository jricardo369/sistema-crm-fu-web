<app-workspace-nav>
    <app-general-nav></app-general-nav>
</app-workspace-nav>
<div class='workspace'>
    <div class='main'>

        <app-experimental-menu titulo="Integrations Configuration"></app-experimental-menu>

        <div class='content'>
            <div style="display:flex; flex-flow: row; max-height: 100%;">
                <div style="min-width:320px;margin-right:24px;">
                    <!-- ================================================== -->
                    <!-- TEL-PRUEBA -->
                    <h4 style="margin: 0 0 12px 0">Test Phone</h4>
                    <div class="iigwo-input">
                        <label>Phone to test</label>
                        <input [(ngModel)]="phoneTest" [attr.readOnly]="cambiandoPhoneTest ? null : false"
                            (ngModelChange)="phoneTest" (input)="phoneTest = onPhoneNumberInput($event.target.value)"
                            placeholder="(###) ###-####" maxlength="14">
                        <p style="margin-top: 5px;">Telephone to send test messages</p>
                    </div>

                    <div style="display: flex; gap: 8px; align-items: center;">
                    
                        <button (click)='cambiandoPhoneTest=true'
                            *ngIf="cambiandoPhoneTest==false" class="btn-color"
                            style="color: #000000; background: #ffffff;border: 0.5px solid #b1b1b1;margin-bottom: 5px;">
                            <span style="color: #000000; font-size: 13px;">Change phone</span>
                        </button>
                    
                        <button (click)='testMessage()' *ngIf="cambiandoPhoneTest==false" class="btn-color"
                            style="color: #ffffff; background: #41949B;margin-bottom: 5px;">
                            <mat-icon svgIcon="done" style="color: #ffffff; width: 14px;  vertical-align: middle;"></mat-icon>
                            <span style="color: #ffffff; font-size: 13px;">Send test message</span>
                        </button>
                    
                        <button (click)='cambiarDato(7)' *ngIf="cambiandoPhoneTest==true" class="btn-color"
                            style="color: #ffffff; background: #8837a2;margin-bottom: 5px;">
                            <mat-icon svgIcon="done" style="color: #ffffff; width: 14px;  vertical-align: middle;"></mat-icon>
                            <span style="color: #ffffff; font-size: 13px;">Change phone</span>
                        </button>
                    
                        <button (click)="cancelarCambio(7)" *ngIf="cambiandoPhoneTest==true" class="btn-color"
                            style="color: #000000; background: #ffffff;border: 0.5px solid #b1b1b1;margin-bottom: 5px;">
                            <span style="color: #000000; font-size: 13px;">Cancel</span>
                        </button>
                    </div>

                    <!--
                    <button class="iigwo" (click)="cambiandoPhoneTest=true" *ngIf="cambiandoPhoneTest==false">
                        <label>Change phone</label>
                    </button>
                    <button class="iigwo accent" (click)="cambiarDato(7)" *ngIf="cambiandoPhoneTest==true">
                        <label>Change phone</label>
                    </button>
                    <button class="iigwo" (click)="cancelarCambio(7)" *ngIf="cambiandoPhoneTest==true">
                        <label>Cancel</label>
                    </button>
                    <button class="iigwo accent" (click)="testMessage()" style="background: #41949B;" *ngIf="cambiandoPhoneTest==false">
                        <label>Send test message</label>
                    </button>
                    -->

                    <hr style="max-width:396px;margin-bottom:24px;">
                    <!-- ================================================== -->
                    <!-- TOKEN -->
                    <h4 style="margin: 0 0 12px 0">Token</h4>
                    <div class="iigwo-input">
                        <label>Token id Podium</label>
                        <textarea [(ngModel)]="tokenId" [attr.readOnly]="cambiandoTokenId ? null : false"
                            (ngModelChange)="tokenId" ></textarea>
                        <p style="margin-top: 5px;">Generated token for Podium, this data is updated automatically</p>
                    </div>

                    <div style="display: flex; gap: 8px; align-items: center;">
                    
                        <button (click)='cambiandoTokenId=true' *ngIf="cambiandoTokenId==false"
                            class="btn-color" style="color: #000000; background: #ffffff;border: 0.5px solid #b1b1b1;margin-bottom: 5px;">
                            <span style="color: #000000; font-size: 13px;">Change token id</span>
                        </button>
                    
                        <button (click)='cambiarDato(5)' *ngIf="cambiandoTokenId==true" class="btn-color"
                            style="color: #ffffff; background: #8837a2;margin-bottom: 5px;">
                            <mat-icon svgIcon="done" style="color: #ffffff; width: 14px;  vertical-align: middle;"></mat-icon>
                            <span style="color: #ffffff; font-size: 13px;">Change token id</span>
                        </button>
                    
                        <button (click)="cancelarCambio(5)" *ngIf="cambiandoTokenId==true" class="btn-color"
                            style="color: #000000; background: #ffffff;border: 0.5px solid #b1b1b1;margin-bottom: 5px;">
                            <span style="color: #000000; font-size: 13px;">Cancel</span>
                        </button>
                    
                    </div>
