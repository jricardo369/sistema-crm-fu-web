<form>

  <mat-icon svgIcon="person"></mat-icon>
  <div class='iigwo-input'>
    <input [(ngModel)]='user.usuario' name='usuario' placeholder="User">
  </div>
  <div class='iigwo-input'>
    <input [(ngModel)]='password' name='password' placeholder="Password" type="password">
  </div>
  <button class='iigwo accent' (click)='ingresar()'>
  Login</button>
</form>
<!-- LOADING -->
@if (loading) {
  <div class='iigwo-loading'>
    <mat-spinner></mat-spinner>
  </div>
}
